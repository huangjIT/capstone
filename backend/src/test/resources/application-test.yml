# Test profile: swap Postgres for in-memory H2 (PostgreSQL compatibility mode)
# so `mvn test` runs without docker-compose. Redis/Kafka clients connect lazily
# or retry in the background, so the context loads without those brokers too.
spring:
  datasource:
    url: jdbc:h2:mem:pet_social_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
