
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true

spring:
  application:
    name: pet_social

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/pet_social_db
    username: admin
    password: rootpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Automatically updates DB schema based on your Java entities
    show-sql: true # Prints SQL queries to the console for easy debugging
    properties:
      hibernate:
        format_sql: true

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # MUST BE JSON
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: dispatch-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # MUST BE JSON
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Security requirement to allow JSON to convert into your DTOs
        spring.json.trusted.packages: "*"