# Full PawPal stack for a single AWS EC2 instance (infra + Spring Boot app).
# Usage on the server:  docker compose -f docker-compose.aws.yml up -d --build
# Local dev keeps using docker-compose.yml (infra only) + mvnw spring-boot:run.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pet-social-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rootpassword # change me (must match DB_PASSWORD below)
      POSTGRES_DB: pet_social_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis/redis-stack:latest
    container_name: pet-social-redis
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pet-social-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  app:
    build: .
    container_name: pet-social-app
    ports:
      - "8080:8080" # the ONLY port exposed to the internet
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pet_social_db
      DB_USERNAME: admin
      DB_PASSWORD: rootpassword # change me (must match POSTGRES_PASSWORD above)
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Generated for this deployment; rotate it if the repo ever becomes public.
      APP_JWT_SECRET: "YPMBkub0XAInvKVqgSdPej+18T++Qwa1WsbzK8MykwUYRoSF6LHJs6dypHw3f+ac"
      APP_CORS_ALLOWED_ORIGINS: "*"
      # This box is internet-reachable: keep the unauthenticated load-generation and
      # Redis-introspection endpoints off. Set to "true" temporarily to run a load test.
      APP_TEST_ENDPOINTS_ENABLED: "false"
    depends_on:
      - postgres
      - redis
      - kafka
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
